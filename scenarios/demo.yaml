name: 'Touch UI Demo'
version: 1
author: 'Demo Bot'

steps:
  - wait-serial: 'Touch UI ready'

  # Simulate touch on ON button via serial (built-in touch not exposed for CLI automation)
  - write-serial: 'TOUCH 120 100'
  - delay: 500ms
  - wait-serial: 'LED: GREEN'

  # Simulate touch on OFF button via serial
  - write-serial: 'TOUCH 120 200'
  - delay: 500ms
  - wait-serial: 'LED: RED'
