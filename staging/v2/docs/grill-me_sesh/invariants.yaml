# Non-negotiable rules from grill session

invariants:
  - id: emulation_fidelity
    statement: >
      All hardware behavior must originate from real Wokwi emulation
      (wokwi-cli and/or Wokwi native sim UI).
    prohibits:
      - Client-side JavaScript approximating sensor readings
      - Client-side JavaScript approximating actuator states
      - Client-side JavaScript approximating MCU serial output
      - HTML widgets that mimic hardware displays without Wokwi backing
    exemplar_violation:
      file: app.py
      pattern: static/index.html LCD mimic; only serial path is real

  - id: variant_confirmation
    statement: >
      When prompt does not exactly match a recipe, agent presents nearest
      variant and waits for operator confirmation before generation.
    prohibits:
      - Silent best-guess generation

  - id: wokwi_substrate_v1
    statement: Wokwi is the only simulation substrate in v1.
    prohibits:
      - Substrate abstraction layer in v1
    note: Alternatives (SimulIDE, Renode) deferred per operator decision

  - id: no_wokwi_publish_api
    statement: >
      et2 cannot auto-create wokwi.com project URLs; deliver ZIP + import
      instructions instead.
    source: docs/superpowers/specs/2026-05-09-wokwi-project-publisher-design.md
