name: 'Motion Alarm Demo'
version: 1
author: 'Demo Bot'

steps:
  - wait-serial: 'Motion Alarm armed'

  # Normal state
  - set-control:
      part-id: mpu
      control: accelX
      value: 0
  - set-control:
      part-id: mpu
      control: accelY
      value: 0
  - delay: 500ms

  # Simulate shake
  - set-control:
      part-id: mpu
      control: accelX
      value: 2.5
  - delay: 500ms

  - wait-serial: 'ALARM: Motion detected!'
  - expect-pin:
      part-id: esp
      pin: 2
      expected: 1

  # Reset
  - set-control:
      part-id: mpu
      control: accelX
      value: 0
  - delay: 500ms
  - wait-serial: 'Alarm cleared'
